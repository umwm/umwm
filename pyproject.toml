[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umwm"
dynamic = ["version"]
description = "University of Miami Wave Model: Python interface and command-line tool"
readme = "python/README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "UMWM contributors"}]
maintainers = [{name = "Milan Curcic"}]
keywords = ["ocean", "waves", "wave model", "spectral", "fortran"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Fortran",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.23",
    "xarray>=2023.1",
    "netCDF4>=1.6",
]

[project.optional-dependencies]
test = ["pytest"]
lazy = ["dask"]
plot = ["matplotlib"]

[project.scripts]
umwm = "umwm.cli:main"

[project.urls]
Homepage = "https://github.com/umwm/umwm"
Documentation = "https://github.com/umwm/umwm/blob/main/python/README.md"

[dependency-groups]
# Installed by `uv sync` (and `uv run`) by default, for developing and testing.
dev = ["pytest", "matplotlib"]

[tool.uv]
# The package build compiles the Fortran sources into the shared library, so
# uv rebuilds it when they, the build files, or the build options change, not
# only when pyproject.toml does.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "MANIFEST.in" },
    { file = "src/*.f90" },
    { file = "src/Makefile" },
    { file = "mk/config.mk" },
    { env = "UMWM_MPI" },
    { env = "UMWM_FC" },
    { env = "UMWM_FCFLAGS" },
    { env = "UMWM_CPPFLAGS" },
    { env = "UMWM_LDFLAGS" },
    { env = "UMWM_LDLIBS" },
    { env = "UMWM_NF_CONFIG" },
    { env = "UMWM_NETCDF" },
    { env = "UMWM_NETCDF_FFLAGS" },
    { env = "UMWM_NETCDF_FLIBS" },
    { env = "UMWM_LIBRARY" },
]

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["umwm"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "umwm.__version__"}

[tool.setuptools.package-data]
umwm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
