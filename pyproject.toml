[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umwm"
version = "0.1.0"
description = "University of Miami Wave Model: Python interface and command-line tool"
readme = "python/README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "UMWM contributors"}]
maintainers = [{name = "Milan Curcic"}]
keywords = ["ocean", "waves", "wave model", "spectral", "fortran"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Fortran",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.23",
    "xarray>=2023.1",
    "netCDF4>=1.6",
]

[project.optional-dependencies]
test = ["pytest"]
lazy = ["dask"]

[project.scripts]
umwm = "umwm.cli:main"

[project.urls]
Homepage = "https://github.com/umwm/umwm"
Documentation = "https://github.com/umwm/umwm/blob/main/python/README.md"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["umwm"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["python/tests"]
