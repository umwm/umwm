name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            gfortran \
            libnetcdff-dev \
            make \
            netcdf-bin

      - name: Print build configuration
        run: make print-config

      - name: Build UMWM
        run: make umwm

      - name: Run tests
        run: make test
