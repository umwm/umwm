name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            gfortran \
            libnetcdff-dev \
            make \
            netcdf-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Print build configuration
        run: make print-config

      - name: Build UMWM
        run: make umwm

      - name: Run tests
        run: make test

  intel-fpm:
    runs-on: ubuntu-24.04
    env:
      NETCDF_PREFIX: ${{ github.workspace }}/.intel-netcdf

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Set up Intel Fortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: intel
          version: "2025.2"

      - name: Set up fpm
        uses: fortran-lang/setup-fpm@v7
        with:
          fpm-version: "v0.12.0"

      - name: Install Intel MPI and build dependencies
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            curl \
            intel-oneapi-mpi-devel \
            make

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Cache Intel netCDF stack
        id: cache-intel-netcdf
        uses: actions/cache@v4
        with:
          path: ${{ env.NETCDF_PREFIX }}
          key: intel-netcdf-ifx-2025.2-zlib-1.3.2-hdf5-1.14.6-c-4.10.1-fortran-4.6.4

      - name: Build Intel netCDF-4 stack
        if: steps.cache-intel-netcdf.outputs.cache-hit != 'true'
        run: .github/scripts/build-intel-netcdf.sh "$NETCDF_PREFIX"

      - name: Build and test with ifx and Intel MPI
        run: |
          source /opt/intel/oneapi/mpi/latest/env/vars.sh
          export PATH="$NETCDF_PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$NETCDF_PREFIX/lib:${LD_LIBRARY_PATH:-}"
          export PKG_CONFIG_PATH="$NETCDF_PREFIX/lib/pkgconfig"
          unset I_MPI_F90 I_MPI_f90
          export MPIFC=mpiifx
          export PYTHON=python
          test "$(nc-config --has-nc4)" = yes
          test "$(nf-config --has-nc4)" = yes
          fpm test --compiler ifx --runner ./tests/fpm-mpi-test-runner.sh
